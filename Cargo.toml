[package]
name = "pdf-loom"
version = "0.1.2"
edition = "2021"
description = "Lightweight client-side PDF manipulation engine compiled to WebAssembly"
license = "MIT"
readme = "README.md"
repository = "https://github.com/amansahani/pdf-loom"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console_error_panic_hook"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
